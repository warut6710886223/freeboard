<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  databaseURL:
    "https://iot-223-cd3eb-default-rtdb.asia-southeast1.firebasedatabase.app"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

console.log("Firebase connected");



/* =========================
   ELEMENT
========================= */

const waterLevel =
  document.getElementById("water_level");

const rainfall =
  document.getElementById("rainfall");

const waterRate =
  document.getElementById("water_rate");

const temperature =
  document.getElementById("temperature");

const humidity =
  document.getElementById("humidity");

const drainStatus =
  document.getElementById("drain_status");

const status =
  document.getElementById("status");

const progress =
  document.getElementById("waterProgress");

const lastUpdate =
  document.getElementById("lastUpdate");



/* =========================
   CHECK ELEMENT
========================= */

console.log("HTML elements:", {

  waterLevel,
  rainfall,
  waterRate,
  temperature,
  humidity,
  drainStatus,
  status

});



/* =========================
   STATUS
========================= */

function updateStatus(level){

  if(level < 30){

    status.textContent =
      "🟢 ปกติ";

    status.className =
      "s-ok";

  }

  else if(level < 60){

    status.textContent =
      "🟡 เฝ้าระวัง";

    status.className =
      "s-warn";

  }

  else if(level < 80){

    status.textContent =
      "🟠 เสี่ยงสูง";

    status.className =
      "s-hi";

  }

  else{

    status.textContent =
      "🔴 วิกฤต";

    status.className =
      "s-crit";

  }


  progress.style.width =
    Math.min(
      Math.max(level,0),
      100
    ) + "%";

}



/* =========================
   READ /sensors
========================= */

const sensorsRef =
  ref(db,"sensors");


onValue(

  sensorsRef,

  (snapshot) => {

    console.log(
      "========== FIREBASE DATA =========="
    );


    console.log(
      snapshot.val()
    );


    const data =
      snapshot.val();


    if(!data){

      console.error(
        "ไม่พบข้อมูลใน /sensors"
      );

      status.textContent =
        "⚠️ ไม่พบข้อมูล";

      return;

    }



    /* WATER LEVEL */

    if(data.water_level != null){

      const value =
        Number(
          data.water_level
        );


      waterLevel.textContent =
        value.toFixed(1);


      updateStatus(
        value
      );

    }



    /* RAIN */

    if(data.rainfall != null){

      rainfall.textContent =
        Number(
          data.rainfall
        ).toFixed(1);

    }



    /* WATER RATE */

    if(data.water_rate != null){

      waterRate.textContent =
        Number(
          data.water_rate
        ).toFixed(1);

    }



    /* TEMPERATURE */

    if(data.temperature != null){

      temperature.textContent =
        Number(
          data.temperature
        ).toFixed(1);

    }



    /* HUMIDITY */

    if(data.humidity != null){

      humidity.textContent =
        Number(
          data.humidity
        ).toFixed(1);

    }



    /* DRAIN */

    if(data.drain_status != null){

      const drain =
        Number(
          data.drain_status
        );


      if(drain === 1){

        drainStatus.textContent =
          "ทำงาน";

        drainStatus.style.color =
          "var(--ok)";

      }

      else{

        drainStatus.textContent =
          "หยุด";

        drainStatus.style.color =
          "var(--crit)";

      }

    }



    /* UPDATE TIME */

    lastUpdate.textContent =
      "อัปเดตล่าสุด: " +
      new Date().toLocaleTimeString(
        "th-TH"
      );


    console.log(
      "Dashboard updated successfully"
    );

  },


  (error) => {

    console.error(
      "Firebase ERROR:",
      error
    );


    status.textContent =
      "❌ Firebase Error";

  }

);



/* =========================
   CHART
========================= */

const chart =
new Chart(

  document.getElementById(
    "waterChart"
  ),

  {

    type:"line",

    data:{

      labels:[],

      datasets:[

        {

          label:
            "ระดับน้ำ (cm)",

          data:[],

          borderColor:
            "#3cc8ff",

          backgroundColor:
            "rgba(60,200,255,.12)",

          fill:true,

          tension:.35,

          yAxisID:"y"

        },


        {

          label:
            "ฝน (mm/h)",

          data:[],

          borderColor:
            "#ffd166",

          borderDash:[
            5,
            4
          ],

          tension:.35,

          yAxisID:"y1"

        }

      ]

    },


    options:{

      responsive:true,

      maintainAspectRatio:false,

      interaction:{

        mode:"index",

        intersect:false

      },

      scales:{

        y:{

          beginAtZero:true

        },

        y1:{

          position:"right",

          beginAtZero:true,

          grid:{

            drawOnChartArea:false

          }

        }

      }

    }

  }

);



/* =========================
   READ /history
========================= */

const historyRef =
  ref(db,"history");


onValue(

  historyRef,

  (snapshot) => {

    console.log(
      "========== HISTORY =========="
    );


    const data =
      snapshot.val();


    console.log(
      data
    );


    if(!data){

      console.warn(
        "ยังไม่มีข้อมูล /history"
      );

      return;

    }


    const records =
      Object.values(data);


    /* เอา 60 ตัวล่าสุด */

    const latest =
      records.slice(-60);


    chart.data.labels =
      latest.map(
        (_,index) =>
          "#" + (index + 1)
      );


    chart.data.datasets[0]
      .data =
      latest.map(
        item =>
          Number(
            item.water_level || 0
          )
      );


    chart.data.datasets[1]
      .data =
      latest.map(
        item =>
          Number(
            item.rainfall || 0
          )
      );


    chart.update();


    console.log(
      "Chart updated:",
      latest.length,
      "records"
    );

  },


  (error) => {

    console.error(
      "History ERROR:",
      error
    );

  }

);


</script>
